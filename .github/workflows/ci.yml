name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BATS_VERSION: v1.11.1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck on all scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "."
          severity: style
        env:
          SHELLCHECK_OPTS: -x

      - name: Syntax check (bash -n)
        run: |
          set -euo pipefail
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
          echo "bash -n passed for $(find scripts -name '*.sh' | wc -l) scripts"

  bats:
    name: Bats tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      # The distro bats package on 22.04 (1.2.x) predates BATS_TEST_TMPDIR,
      # so pin a known bats-core release everywhere instead.
      - name: Install bats-core and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          git clone --depth 1 --branch "${BATS_VERSION}" https://github.com/bats-core/bats-core /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          bats --version

      - name: Run bats
        run: bats --print-output-on-failure --timing tests/

  rhel-family:
    name: Bats tests (Rocky Linux 9 container)
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: Install dependencies
        run: |
          dnf install -y -q git tar gzip findutils procps-ng openssh-server openssh-clients util-linux which
          git clone --depth 1 --branch "${BATS_VERSION}" https://github.com/bats-core/bats-core /tmp/bats-core
          /tmp/bats-core/install.sh /usr/local

      - uses: actions/checkout@v4

      - name: Run bats as an unprivileged user
        # Containers run as root; the dry-run tests intentionally assert
        # non-root behaviour, so run the suite as a normal user.
        run: |
          useradd -m ci
          chown -R ci "$GITHUB_WORKSPACE"
          su ci -c "bats --print-output-on-failure tests/"
